<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Singhania And Sons Films</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            text-align: center;
            padding: 30px 15px;
            background: #111;
        }

        header h1 {
            color: #d4af37;
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 18px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero h2 span {
            color: #d4af37;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 40px;
            max-width: 750px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 17px 35px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            min-width: 190px;
            text-align: center;
        }

        .admin-btn {
            background: #d4af37;
            color: #111;
        }

        .waiter-btn {
            background: #2196f3;
            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }

        footer {
            background: #000;
            text-align: center;
            padding: 25px;
        }

        footer p {
            margin: 5px;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 30px;
            }

            .hero p {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SINGHANIA AND SONS FILMS</h1>
    <p>PRIVATE LIMITED</p>
</header>

<section class="hero">

    <h2>
        Professional Staffing for
        <span>Hotels, Restaurants & Banquets</span>
    </h2>

    <p>
        Reliable and trained manpower solutions for hotels,
        restaurants, banquets and events.
    </p>

    <div class="buttons">

        <!-- ADMIN LOGIN -->
        <a href="/admin-login" class="btn admin-btn">
            👨‍💼 Admin Login
        </a>

        <!-- WAITER LOGIN -->
        <a href="/waiter-login" class="btn waiter-btn">
            👨‍🍳 Waiter Login
        </a>

    </div>

</section>

<footer>
    <p>© 2026 Singhania And Sons Films Private Limited</p>
    <p>Mumbai, Maharashtra</p>
</footer>

</body>
</html>
