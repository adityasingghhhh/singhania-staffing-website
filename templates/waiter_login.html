<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waiter Login | Singhania And Sons Films</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            color: #d4af37;
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 17px;
        }

        .login-container {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        .login-box h2 {
            font-size: 30px;
            margin-bottom: 30px;
            color: #222;
        }

        .login-box input {
            width: 100%;
            padding: 16px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #d4af37;
        }

        .login-box button {
            width: 100%;
            padding: 16px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #b8941f;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer p {
            margin: 5px;
        }

        .error {
            color: red;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<header>

    <h1>SINGHANIA AND SONS FILMS</h1>

    <p>PRIVATE LIMITED</p>

</header>


<div class="login-container">

    <div class="login-box">

        <h2>👨‍🍳 Waiter Login</h2>

        <form method="POST" action="/waiter-login">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>


<footer>

    <p>© 2026 Singhania And Sons Films Private Limited</p>

    <p>Mumbai, Maharashtra</p>

</footer>

</body>

</html>
