<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Singhania And Sons Films</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            color: #d4af37;
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 17px;
        }

        .login-container {
            min-height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b8941f;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer p {
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>SINGHANIA AND SONS FILMS</h1>
    <p>PRIVATE LIMITED</p>
</header>

<div class="login-container">

    <div class="login-box">

        <h2>👨‍💼 Admin Login</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin-login">

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

    </div>

</div>

<footer>
    <p>© 2026 Singhania And Sons Films Private Limited</p>
    <p>Mumbai, Maharashtra</p>
</footer>

</body>

</html>
